plugins {
    id 'com.android.application'
}

android {
    namespace 'com.b4apaw.audiotap'
    compileSdk 33

    defaultConfig {
        applicationId "com.b4apaw.audiotap"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
