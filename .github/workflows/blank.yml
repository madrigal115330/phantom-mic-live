name: Build PhantomMic Live

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout holder repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'ndk;25.2.9519653' 'cmake;3.22.1'

      - name: Clone upstream PhantomMic
        shell: bash
        run: |
          git clone https://github.com/Mino260806/PhantomMic.git upstream
          cd upstream
          git checkout 768cb32db3eab234083bdc35ad40f9bed833fcc8

      - name: Apply LIVE PCM patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_live.py
          python3 /tmp/patch_live.py

      - name: Build signed debug APK
        shell: bash
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APK='upstream/app/build/outputs/apk/debug/app-debug.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" PhantomMic-Live-debug-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomMic-Live-signed-apk
          path: PhantomMic-Live-debug-signed.apk
          if-no-files-found: error
