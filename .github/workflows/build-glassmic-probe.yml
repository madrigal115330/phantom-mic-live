name: Build GlassMic Embedded Probe
on:
  push:
    branches: ['glassmic-embedded-probe']
    paths: ['glassmic-embedded/**', '.github/workflows/build-glassmic-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Build standalone payload
        working-directory: glassmic-embedded
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify payload
        run: |
          APK=glassmic-embedded/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so'
      - uses: actions/upload-artifact@v4
        with:
          name: GlassMic-Embedded-Probe-arm64-UNMERGED
          path: glassmic-embedded/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: glassmic-build-reports
          path: glassmic-embedded/app/build/reports
