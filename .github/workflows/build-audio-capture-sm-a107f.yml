name: Build SM-A107F APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audio-capture-sm-a107f/**"
      - ".github/workflows/build-audio-capture-sm-a107f.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            audio-capture-sm-a107f/*.gradle.kts
            audio-capture-sm-a107f/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        working-directory: audio-capture-sm-a107f
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install pinned Android toolchain
        working-directory: audio-capture-sm-a107f
        run: >-
          sdkmanager
          "platforms;android-34"
          "build-tools;34.0.0"
          "cmake;3.22.1"
          "ndk;26.1.10909125"

      - name: Build debug APK
        working-directory: audio-capture-sm-a107f
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SM-A107F-debug-apk
          path: audio-capture-sm-a107f/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
