# Builds the STT replacement only; it never accesses Android's microphone.
name: Build WhisperStt for B4A

on:
  workflow_dispatch:
  push:
    branches: [main, build/whisper-stt]
    paths:
      - 'whisperstt/**'
      - '.github/workflows/build-whisper-stt.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  pull_request:
    paths:
      - 'whisperstt/**'
      - '.github/workflows/build-whisper-stt.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Checkout pinned whisper.cpp
        uses: actions/checkout@v5
        with:
          repository: ggml-org/whisper.cpp
          ref: 5670d5c0bbcb148feabef84400a07cfca9aa3b30
          path: third_party/whisper.cpp

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android native tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Build release AAR
        run: gradle --no-daemon :whisperstt:assembleRelease

      - name: Prepare B4A files
        run: |
          set -euo pipefail
          mkdir -p out/arm64-v8a
          unzip -p whisperstt/build/outputs/aar/whisperstt-release.aar classes.jar > out/WhisperStt.jar
          unzip -p whisperstt/build/outputs/aar/whisperstt-release.aar jni/arm64-v8a/libwhisper.so > out/arm64-v8a/libwhisper.so
          cp whisperstt/build/outputs/aar/whisperstt-release.aar out/WhisperStt.aar
          test -s out/WhisperStt.jar
          test -s out/arm64-v8a/libwhisper.so

      - name: Upload B4A artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperStt-B4A-arm64-v8a
          path: out/
          if-no-files-found: error
