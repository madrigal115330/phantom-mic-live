name: Build B4APaw AudioTap

on:
  workflow_dispatch:
  push:
    branches: [ speaker-tap-build5 ]
    paths:
      - 'audiotap/**'
      - '.github/workflows/build_audiotap.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'
      - name: Build AudioTap debug APK
        working-directory: audiotap
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: B4APawAudioTap-debug
          path: audiotap/app/build/outputs/apk/debug/app-debug.apk
